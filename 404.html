<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | JovianeX AI Ecosystem</title>
  
  <!-- SEO Directives -->
  <meta name="robots" content="noindex, follow">
  
  <!-- Master Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <!-- Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="flex align-center justify-center" style="min-height: 100vh; background-color: var(--bg-primary); margin: 0; padding: var(--space-24);">

  <!-- Glassmorphic Warning Card -->
  <div class="card text-center flex flex-column align-center" style="max-width: 480px; padding: var(--space-48) var(--space-32); gap: var(--space-20); border-color: rgba(255,255,255,0.06); background-color: var(--bg-secondary);">
    <div class="launch-badge" style="background-color: var(--color-primary-glow); border: 1px solid var(--border-color-glow); color: var(--color-primary);">⚠️ Error 404</div>
    
    <h1 class="text-gradient" style="font-size: 2.5rem; font-weight: 800; margin: 0; line-height: 1.1;">Lost in Space?</h1>
    
    <p class="text-muted text-small" style="line-height: 1.6; margin: 0;">
      The page you are looking for does not exist, has been removed, or is temporarily unavailable within the JovianeX AI Ecosystem.
    </p>

    <!-- Return action CTA -->
    <div style="margin-top: var(--space-8); width: 100%;">
      <a href="index.html" class="btn btn-secondary w-full" style="padding: var(--space-12) var(--space-24);">Return to Home Page</a>
    </div>
  </div>

</body>
</html>
